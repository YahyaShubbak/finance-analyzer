name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_call:  # the release runs all of this first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Install (exactly as locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check app tests
      - name: Tests
        run: uv run pytest -q
      - name: Migrations match the models
        shell: bash
        run: |
          export FINANCE_DATA_DIR="$RUNNER_TEMP/alembic-check"
          uv run alembic upgrade head
          uv run alembic check

  requirements-in-sync:
    name: requirements*.txt match uv.lock
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compare exported requirements
        run: |
          uv export --locked --no-dev --no-emit-project --format requirements-txt -o /tmp/req.txt
          uv export --locked --all-groups --no-emit-project --format requirements-txt -o /tmp/req-dev.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/req.txt)
          diff <(grep -v '^#' requirements-dev.txt) <(grep -v '^#' /tmp/req-dev.txt)

  frontend:
    name: Frontend build, lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  e2e:
    name: Frontend against a real (throwaway) backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --locked --no-dev
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - name: Start backend with an empty data directory
        working-directory: backend
        run: |
          FINANCE_DATA_DIR="$RUNNER_TEMP/e2e-data" nohup .venv/bin/python -m app --port 8421 --no-open > "$RUNNER_TEMP/server.log" 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8421/health && break; sleep 1; done
      - name: Integration tests
        working-directory: frontend
        run: E2E_API_BASE=http://127.0.0.1:8421 npm test
      - if: failure()
        run: cat "$RUNNER_TEMP/server.log"

  install-linux:
    name: install.sh (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [uv, pip]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: matrix.variant == 'uv'
      - uses: actions/setup-python@v5
        if: matrix.variant == 'pip'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install non-interactively
        run: |
          extra=""; [ "${{ matrix.variant }}" = pip ] && extra="--no-uv"
          ./install.sh --yes --data-dir "$RUNNER_TEMP/data dir" --port 8431 $extra
      - name: Start and smoke-test
        run: |
          nohup ./run.sh --no-open > "$RUNNER_TEMP/run.log" 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8431/health && break; sleep 1; done
          curl -fsS http://localhost:8431/ | grep -q '<div id="root">'
          curl -fsS http://127.0.0.1:8431/transactions | grep -q '<div id="root">'
          test -f "$RUNNER_TEMP/data dir/finance.db"
      - name: Update while the app is running
        run: |
          # as after `git pull`: the installer finds the app running, stops it, installs again
          extra=""; [ "${{ matrix.variant }}" = pip ] && extra="--no-uv"
          ./install.sh --yes --port 8431 $extra
          if curl -fsS http://127.0.0.1:8431/health; then echo "the app was not stopped for the update"; exit 1; fi
          grep -q "data dir" finance.env  # the settings are kept
          nohup ./run.sh --no-open > "$RUNNER_TEMP/run.log" 2>&1 &
          for i in $(seq 30); do curl -fsS http://127.0.0.1:8431/health && break; sleep 1; done
          curl -fsS http://127.0.0.1:8431/health
      - name: Refuse to switch to an empty data folder without being asked
        run: |
          extra=""; [ "${{ matrix.variant }}" = pip ] && extra="--no-uv"
          if ./install.sh --yes --data-dir "$RUNNER_TEMP/other" --port 8431 $extra; then
            echo "switched to an empty data folder: the app would start without the user's data"; exit 1
          fi
          grep -q "data dir" finance.env
          test ! -e "$RUNNER_TEMP/other"
      - if: failure()
        run: cat "$RUNNER_TEMP/run.log" || true

  install-windows:
    name: install.bat (${{ matrix.variant }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: [uv, pip]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        if: matrix.variant == 'uv'
      - uses: actions/setup-python@v5
        if: matrix.variant == 'pip'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install non-interactively (path with spaces and parentheses)
        shell: cmd
        run: |
          set "EXTRA="
          if "${{ matrix.variant }}"=="pip" set "EXTRA=-NoUv"
          call install.bat -Yes -DataDir "%RUNNER_TEMP%\data dir (test)" -Port 8431 %EXTRA%
      - name: Start and smoke-test
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "run.bat", "--no-open" -PassThru -WindowStyle Hidden
          $ok = $false
          foreach ($i in 1..30) {
            try { Invoke-RestMethod http://127.0.0.1:8431/health | Out-Null; $ok = $true; break } catch { Start-Sleep 1 }
          }
          if (-not $ok) { throw "backend did not start" }
          $index = Invoke-WebRequest http://localhost:8431/transactions -UseBasicParsing
          if ($index.Content -notmatch '<div id="root">') { throw "SPA fallback missing" }
          if (-not (Test-Path "$env:RUNNER_TEMP\data dir (test)\finance.db")) { throw "database not created in the chosen folder" }
          Get-Content finance.env
      - name: Update while the app is running, and refuse an empty data folder
        shell: pwsh
        run: |
          function Test-App { try { Invoke-RestMethod http://127.0.0.1:8431/health | Out-Null; return $true } catch { return $false } }
          function Start-App {
            Start-Process -FilePath "cmd.exe" -ArgumentList "/c", "run.bat", "--no-open" -WindowStyle Hidden
            foreach ($i in 1..30) { if (Test-App) { return }; Start-Sleep 1 }
            throw "backend did not start"
          }
          if (-not (Test-App)) { Start-App }  # (the one of the step before may have ended with it)
          $extra = @(); if ("${{ matrix.variant }}" -eq "pip") { $extra = @("-NoUv") }

          # as after `git pull`: the installer finds the app running, stops it, installs again
          cmd /c install.bat -Yes -Port 8431 @extra
          if ($LASTEXITCODE -ne 0) { throw "the update over a running app failed" }
          if (Test-App) { throw "the app was not stopped for the update" }
          if (-not (Select-String -Path finance.env -Pattern "data dir \(test\)" -Quiet)) { throw "the settings were not kept" }
          Start-App

          cmd /c install.bat -Yes -DataDir "$env:RUNNER_TEMP\other" -Port 8431 @extra
          if ($LASTEXITCODE -eq 0) { throw "switched to an empty data folder: the app would start without the user's data" }
          if (-not (Select-String -Path finance.env -Pattern "data dir \(test\)" -Quiet)) { throw "the data folder was changed" }
          if (Test-Path "$env:RUNNER_TEMP\other") { throw "the refused folder was created" }
          exit 0  # (the step would otherwise end with the installer's exit code: the refusal that was wanted)
