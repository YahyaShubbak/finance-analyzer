name: Release

# Pushing a tag like v0.8.0 publishes a GitHub release with a ready-to-install
# archive that already contains the built web interface — so installing from
# it needs no Node.js (install.sh / install.bat skip the build when
# frontend/dist exists and Node.js is missing).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Nothing is published that did not pass what every change has to pass.
  checks:
    uses: ./.github/workflows/ci.yml

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write  # only this job creates the release
    steps:
      - uses: actions/checkout@v4
      - name: The tag is the version the app reports
        run: |
          tag="${GITHUB_REF_NAME#v}"
          backend="$(sed -n 's/^version = "\(.*\)"$/\1/p' backend/pyproject.toml | head -n1)"
          app="$(sed -n 's/^APP_VERSION = "\(.*\)"$/\1/p' backend/app/config.py)"
          frontend="$(sed -n 's/^  "version": "\(.*\)",$/\1/p' frontend/package.json | head -n1)"
          echo "tag $tag, backend $backend, app $app, frontend $frontend"
          if [ "$tag" != "$backend" ] || [ "$tag" != "$app" ] || [ "$tag" != "$frontend" ]; then
            echo "::error::The tag $GITHUB_REF_NAME does not match the version in backend/pyproject.toml, backend/app/config.py and frontend/package.json."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the web interface
        working-directory: frontend
        run: npm ci && npm run build
      - name: Create archives
        run: |
          name="finance-analyzer-${GITHUB_REF_NAME}"
          mkdir -p "dist-release/$name"
          git archive HEAD | tar -x -C "dist-release/$name"
          cp -r frontend/dist "dist-release/$name/frontend/dist"
          cd dist-release
          tar -czf "$name.tar.gz" "$name"
          zip -qr "$name.zip" "$name"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist-release/*.tar.gz dist-release/*.zip \
            --title "$GITHUB_REF_NAME" --generate-notes
